[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"
  NEXT_USE_NETLIFY_EDGE = "true"

# Turso / LibSQL — pas de module natif, compatible serverless Lambda
# Les variables TURSO_DATABASE_URL et TURSO_AUTH_TOKEN sont configurées
# dans l'UI Netlify (Site settings > Environment variables).

[[plugins]]
  package = "@netlify/plugin-nextjs"
